[project]
name = "contact-center-copilot"
version = "0.1.0"
description = "Multi-agent system that turns contact center diagnostic Excel data into narrative reports with industry benchmarking."
authors = [
    { name = "Sergey Chernyakov" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LLM / orchestration
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.50",

    # RAG
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",

    # MCP
    "fastmcp>=0.4.0",

    # Data / structured output
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "numpy>=1.26.0",

    # UI
    "streamlit>=1.39.0",
    "plotly>=5.24.0",

    # Observability
    "langsmith>=0.1.130",

    # Config
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=0.3.0",
]
ollama = [
    "langchain-ollama>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
eval = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference", "data", "tmp", "media", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import sorting)
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "C4",       # flake8-comprehensions
    "T20",      # flake8-print (use logging, never print())
    "PT",       # flake8-pytest-style
    "PTH",      # flake8-use-pathlib
    "ICN",      # flake8-import-conventions
    "ISC",      # flake8-implicit-str-concat
    "RUF",      # ruff-specific rules
]
ignore = [
    "E501",     # line too long — handled by `ruff format`
    "B008",     # function call in argument defaults
    "ISC001",   # conflicts with the formatter
    "UP042",    # Enum -> StrEnum: runtime semantics differ, migrate deliberately
]
# Relative imports are this project's deliberate style — flake8-tidy-imports
# (TID) is intentionally not selected.

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["F401", "F841", "E402", "PT011", "ARG"]
"scripts/**/*" = ["T20"]
"eval/**/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"
strict = false
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
exclude = ["reference/", "build/", "dist/"]

[tool.bandit]
exclude_dirs = ["tests", "reference", "build", "dist", ".venv"]

[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-property-decorators = true
ignore-nested-functions = true
ignore-module = false
exclude = ["tests", "reference", "scripts", "eval", "build", "dist"]
verbose = 1

[tool.vulture]
paths = ["src"]
exclude = ["reference/", "tests/"]
min_confidence = 80
sort_by_size = true

[tool.codespell]
skip = "*.lock,*.json,./.git,./reference,./data,./htmlcov,./.ruff_cache,./.mypy_cache,./.pytest_cache"
check-hidden = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version = "0.1.0"
