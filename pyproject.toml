[project]
name = "contact-center-copilot"
version = "0.1.0"
description = "Multi-agent system for transforming contact center diagnostic data into narrative reports with industry benchmarking."
authors = [{ name = "Sergey Chernyakov" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # LLM + orchestration
    "langchain>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "anthropic>=0.39.0",
    # RAG
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    # MCP
    "fastmcp>=0.2.0",
    # Data / validation
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "numpy>=1.26.0",
    # UI
    "streamlit>=1.37.0",
    # Observability
    "langsmith>=0.1.0",
    # Utils
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    # Tests
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "coverage[toml]>=7.6.0",
    # Lint, format, types
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pylint>=3.3.0",
    # Security
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.0",
    # Docstrings, dead code, spelling, YAML
    "interrogate>=1.7.0",
    "vulture>=2.14",
    "codespell>=2.3.0",
    "yamllint>=1.35.0",
    # Hook runner + commit conventions
    "pre-commit>=4.0.0",
    "commitizen>=3.30.0",
]
eval = [
    "ragas>=0.2.0",
    "datasets>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Tooling configuration. Drives .pre-commit-config.yaml and the Makefile.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference", "data", "tmp", "media", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import sorting)
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "C4",       # flake8-comprehensions
    "T20",      # flake8-print (use logging, never print())
    "PT",       # flake8-pytest-style
    "PTH",      # flake8-use-pathlib
    "ICN",      # flake8-import-conventions
    "TID",      # flake8-tidy-imports
    "ISC",      # flake8-implicit-str-concat
    "RUF",      # ruff-specific rules
]
ignore = [
    "E501",     # line too long — handled by `ruff format`
    "B008",     # function call in argument defaults
    "ISC001",   # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["F401", "F841", "E402", "PT011", "ARG"]
"scripts/**/*" = ["T20"]
"eval/**/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
exclude = ["reference/", "build/", "dist/"]

[tool.bandit]
exclude_dirs = ["tests", "reference", "build", "dist", ".venv"]

[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-property-decorators = true
ignore-nested-functions = true
ignore-module = false
exclude = ["tests", "reference", "scripts", "eval", "build", "dist"]
verbose = 1

[tool.vulture]
paths = ["src"]
exclude = ["reference/", "tests/"]
min_confidence = 80
sort_by_size = true

[tool.codespell]
skip = "*.lock,*.json,./.git,./reference,./data,./htmlcov,./.ruff_cache,./.mypy_cache,./.pytest_cache"
check-hidden = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version = "0.1.0"
