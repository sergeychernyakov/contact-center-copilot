# .yamllint.yml — YAML linting rules (relaxed for CI configs and long lines).
extends: default

rules:
  line-length:
    max: 120
    level: warning
  truthy:
    # GitHub Actions uses `on:` as a key — keep it from being flagged.
    allowed-values: ['true', 'false', 'on', 'off']
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

ignore: |
  reference/
  data/
  .venv/
  htmlcov/
