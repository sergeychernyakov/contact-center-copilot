# .pre-commit-config.yaml
# Quality gate for contact-center-copilot — see Makefile and pyproject.toml.
#
# Activate once:   make install        (installs deps + every hook type)
# Run everything:  make precommit      (or: pre-commit run --all-files)
# Update pins:     make hooks-update   (pre-commit autoupdate)
#
# Hook stages:
#   pre-commit  — fast formatters / linters / fixers on staged files
#   commit-msg  — Conventional Commits message validation
#   pre-push    — heavy checks: types, security, audit, docs, dead code, tests + coverage

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
  python: python3
exclude: '^(reference/|data/|htmlcov/|.*\.lock$)'

repos:
  # --------------------------------------------------------------------------
  # General hygiene — whitespace, syntax, large files, private keys, branch guard
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-ast
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # --------------------------------------------------------------------------
  # Ruff — linter (+ autofix) and formatter (replaces black + isort + flake8)
  # --------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --------------------------------------------------------------------------
  # pygrep-hooks — cheap regex-based Python checks
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  # --------------------------------------------------------------------------
  # codespell — common spelling mistakes in code and docs
  # --------------------------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  # --------------------------------------------------------------------------
  # yamllint — YAML style and correctness
  # --------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  # --------------------------------------------------------------------------
  # gitleaks — secret scanning (API keys, tokens, private keys)
  # --------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --------------------------------------------------------------------------
  # check-jsonschema — validate GitHub Actions workflow files
  # --------------------------------------------------------------------------
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.29.4
    hooks:
      - id: check-github-workflows

  # --------------------------------------------------------------------------
  # hadolint — Dockerfile linter (needs the binary: `brew install hadolint`)
  # --------------------------------------------------------------------------
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: [--config, .hadolint.yaml]

  # --------------------------------------------------------------------------
  # commitizen — enforce Conventional Commits in the commit message
  # --------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.31.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # --------------------------------------------------------------------------
  # Heavy checks — run on `git push` only, via `make` (uses the project venv)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (static type checking)
        entry: make type
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pylint
        name: pylint (code quality, fail-under 9.5/10)
        entry: make pylint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: bandit
        name: bandit (security scan)
        entry: make security
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit (dependency vulnerability audit)
        entry: make audit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: interrogate
        name: interrogate (docstring coverage)
        entry: make docs
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true

      - id: vulture
        name: vulture (dead code detection)
        entry: make deadcode
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest-cov
        name: pytest + coverage gate (>=90%)
        entry: make coverage
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
